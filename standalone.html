<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientific Data Plotter & Curve Fitting</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-lab-report, #printable-lab-report * {
        visibility: visible;
      }
      #printable-lab-report {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-900 min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Math & Regression Engine ---
    function formatSigFigs(num, sigFigs = 4) {
      if (num === null || num === undefined || isNaN(num) || !isFinite(num)) return "N/A";
      if (num === 0) return "0";
      return parseFloat(num.toPrecision(sigFigs)).toString();
    }

    function computeStats(values) {
      const valid = values.filter(v => typeof v === 'number' && !isNaN(v) && isFinite(v));
      if (valid.length === 0) return { mean: 0, stdDev: 0, min: 0, max: 0, count: 0 };
      const sum = valid.reduce((a, b) => a + b, 0);
      const mean = sum / valid.length;
      const variance = valid.reduce((acc, v) => acc + Math.pow(v - mean, 2), 0) / (valid.length > 1 ? valid.length - 1 : 1);
      return {
        mean,
        stdDev: Math.sqrt(variance),
        min: Math.min(...valid),
        max: Math.max(...valid),
        count: valid.length
      };
    }

    function calculateFit(points, fitType, xName = "x", yName = "y") {
      const active = points.filter(p => !p.excluded && !isNaN(p.x) && !isNaN(p.y) && isFinite(p.x) && isFinite(p.y));
      if (active.length < 2) return null;

      const n = active.length;
      const xMean = active.reduce((s, p) => s + p.x, 0) / n;
      const yMean = active.reduce((s, p) => s + p.y, 0) / n;
      const ssTot = active.reduce((s, p) => s + Math.pow(p.y - yMean, 2), 0);

      let predictFn = (x) => 0;
      let equation = "";
      let slope, intercept, a, b, c;

      if (fitType === "linear") {
        let num = 0, den = 0;
        for (const p of active) {
          num += (p.x - xMean) * (p.y - yMean);
          den += Math.pow(p.x - xMean, 2);
        }
        slope = den !== 0 ? num / den : 0;
        intercept = yMean - slope * xMean;
        predictFn = (x) => slope * x + intercept;
        const sign = intercept >= 0 ? "+" : "-";
        equation = `${yName} = ${formatSigFigs(slope, 4)}·${xName} ${sign} ${formatSigFigs(Math.abs(intercept), 4)}`;
      } else if (fitType === "linear_origin") {
        let num = 0, den = 0;
        for (const p of active) {
          num += p.x * p.y;
          den += p.x * p.x;
        }
        slope = den !== 0 ? num / den : 0;
        intercept = 0;
        predictFn = (x) => slope * x;
        equation = `${yName} = ${formatSigFigs(slope, 4)}·${xName}`;
      } else if (fitType === "quadratic") {
        let s0 = n, s1 = 0, s2 = 0, s3 = 0, s4 = 0, t0 = 0, t1 = 0, t2 = 0;
        for (const p of active) {
          const x = p.x, y = p.y, x2 = x * x;
          s1 += x; s2 += x2; s3 += x2 * x; s4 += x2 * x2;
          t0 += y; t1 += x * y; t2 += x2 * y;
        }
        const m00 = s4, m01 = s3, m02 = s2, v0 = t2;
        const m10 = s3, m11 = s2, m12 = s1, v1 = t1;
        const m20 = s2, m21 = s1, m22 = s0, v2 = t0;

        const det = m00 * (m11 * m22 - m12 * m21) - m01 * (m10 * m22 - m12 * m20) + m02 * (m10 * m21 - m11 * m20);
        if (Math.abs(det) > 1e-12) {
          const detA = v0 * (m11 * m22 - m12 * m21) - m01 * (v1 * m22 - m12 * v2) + m02 * (v1 * m21 - m11 * v2);
          const detB = m00 * (v1 * m22 - m12 * v2) - v0 * (m10 * m22 - m12 * m20) + m02 * (m10 * v2 - v1 * m20);
          const detC = m00 * (m11 * v2 - v1 * m21) - m01 * (m10 * v2 - v1 * m20) + v0 * (m10 * m21 - m11 * m20);
          a = detA / det; b = detB / det; c = detC / det;
          predictFn = (x) => a * x * x + b * x + c;
          const signB = b >= 0 ? "+" : "-";
          const signC = c >= 0 ? "+" : "-";
          equation = `${yName} = ${formatSigFigs(a, 3)}·${xName}² ${signB} ${formatSigFigs(Math.abs(b), 3)}·${xName} ${signC} ${formatSigFigs(Math.abs(c), 3)}`;
        } else {
          predictFn = (x) => yMean;
          equation = `${yName} = ${formatSigFigs(yMean, 4)}`;
        }
      } else if (fitType === "power") {
        const valid = active.filter(p => p.x > 0 && p.y > 0);
        if (valid.length >= 2) {
          const logX = valid.map(p => Math.log(p.x));
          const logY = valid.map(p => Math.log(p.y));
          const meanLx = logX.reduce((a, b) => a + b, 0) / valid.length;
          const meanLy = logY.reduce((a, b) => a + b, 0) / valid.length;
          let num = 0, den = 0;
          for (let i = 0; i < valid.length; i++) {
            num += (logX[i] - meanLx) * (logY[i] - meanLy);
            den += Math.pow(logX[i] - meanLx, 2);
          }
          const exponent = den !== 0 ? num / den : 1;
          const logA = meanLy - exponent * meanLx;
          const coeff = Math.exp(logA);
          a = coeff; b = exponent;
          predictFn = (x) => x > 0 ? coeff * Math.pow(x, exponent) : 0;
          equation = `${yName} = ${formatSigFigs(coeff, 4)}·${xName}^(${formatSigFigs(exponent, 4)})`;
        }
      } else if (fitType === "exponential") {
        const valid = active.filter(p => p.y > 0);
        if (valid.length >= 2) {
          const logY = valid.map(p => Math.log(p.y));
          const meanX = valid.reduce((s, p) => s + p.x, 0) / valid.length;
          const meanLy = logY.reduce((a, b) => a + b, 0) / valid.length;
          let num = 0, den = 0;
          for (let i = 0; i < valid.length; i++) {
            num += (valid[i].x - meanX) * (logY[i] - meanLy);
            den += Math.pow(valid[i].x - meanX, 2);
          }
          const slopeExp = den !== 0 ? num / den : 0;
          const interceptExp = meanLy - slopeExp * meanX;
          const coeff = Math.exp(interceptExp);
          a = coeff; b = slopeExp;
          predictFn = (x) => coeff * Math.exp(slopeExp * x);
          equation = `${yName} = ${formatSigFigs(coeff, 4)}·e^(${formatSigFigs(slopeExp, 4)}·${xName})`;
        }
      } else if (fitType === "inverse") {
        let num = 0, den = 0;
        for (const p of active) {
          if (p.x !== 0) {
            const invX = 1 / p.x;
            num += invX * p.y;
            den += invX * invX;
          }
        }
        const k = den !== 0 ? num / den : 0;
        a = k;
        predictFn = (x) => x !== 0 ? k / x : 0;
        equation = `${yName} = ${formatSigFigs(k, 4)} / ${xName}`;
      }

      let ssRes = 0;
      const residuals = [];
      for (const p of active) {
        const pred = predictFn(p.x);
        const res = p.y - pred;
        ssRes += res * res;
        residuals.push({ id: p.id, x: p.x, actualY: p.y, predictedY: pred, residual: res });
      }

      const r2 = ssTot > 0 ? Math.max(0, Math.min(1, 1 - (ssRes / ssTot))) : 1;
      return {
        type: fitType,
        equation,
        slope,
        intercept,
        a,
        b,
        c,
        r2,
        r: Math.sqrt(r2),
        rss: ssRes,
        predict: predictFn,
        residuals
      };
    }

    // --- App Component ---
    const DEFAULT_CONFIG = {
      title: "Experimental Data: Time vs. Distance",
      xName: "Time",
      xUnit: "s",
      yName: "Distance",
      yUnit: "m",
      notes: "Kinematics cart trial run",
      defaultFit: "linear"
    };

    const DEFAULT_POINTS = [
      { id: "p1", x: 1.0, y: 2.1, yUncertainty: 0.15 },
      { id: "p2", x: 2.0, y: 4.3, yUncertainty: 0.2 },
      { id: "p3", x: 3.0, y: 5.9, yUncertainty: 0.2 },
      { id: "p4", x: 4.0, y: 8.2, yUncertainty: 0.25 },
      { id: "p5", x: 5.0, y: 10.1, yUncertainty: 0.3 },
      { id: "p6", x: 6.0, y: 12.3, yUncertainty: 0.3 }
    ];

    function App() {
      const [config, setConfig] = useState(() => {
        try {
          const saved = localStorage.getItem("scilab_standalone_cfg");
          return saved ? JSON.parse(saved) : DEFAULT_CONFIG;
        } catch(e) { return DEFAULT_CONFIG; }
      });

      const [points, setPoints] = useState(() => {
        try {
          const saved = localStorage.getItem("scilab_standalone_pts");
          return saved ? JSON.parse(saved) : DEFAULT_POINTS;
        } catch(e) { return DEFAULT_POINTS; }
      });

      const [selectedFit, setSelectedFit] = useState("linear");
      const [hasTrials, setHasTrials] = useState(false);
      const [isReportOpen, setIsReportOpen] = useState(false);
      const [isImportOpen, setIsImportOpen] = useState(false);
      const [isHelpOpen, setIsHelpOpen] = useState(false);
      const [isEditingHeader, setIsEditingHeader] = useState(false);

      // Temporary header edit states
      const [tTitle, setTTitle] = useState(config.title);
      const [tXName, setTXName] = useState(config.xName);
      const [tXUnit, setTXUnit] = useState(config.xUnit);
      const [tYName, setTYName] = useState(config.yName);
      const [tYUnit, setTYUnit] = useState(config.yUnit);
      const [tNotes, setTNotes] = useState(config.notes || "");

      // Quick fill state
      const [isQuickFill, setIsQuickFill] = useState(false);
      const [qStart, setQStart] = useState("1");
      const [qStep, setQStep] = useState("1");
      const [qCount, setQCount] = useState("6");

      // Import modal raw text
      const [rawPaste, setRawPaste] = useState("");

      // Plot state
      const [dimensions, setDimensions] = useState({ width: 620, height: 400 });
      const [hoveredPoint, setHoveredPoint] = useState(null);
      const [showResiduals, setShowResiduals] = useState(false);
      const [showErrorBars, setShowErrorBars] = useState(true);
      const plotContainerRef = useRef(null);
      const svgRef = useRef(null);

      // Report state
      const [studentName, setStudentName] = useState("Student Scientist");
      const [labPartner, setLabPartner] = useState("");
      const [classSection, setClassSection] = useState("Physics Laboratory Period 3");
      const [reportDate, setReportDate] = useState(new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }));
      const [customConclusion, setCustomConclusion] = useState(config.notes || "");
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        try { localStorage.setItem("scilab_standalone_cfg", JSON.stringify(config)); } catch(e) {}
      }, [config]);

      useEffect(() => {
        try { localStorage.setItem("scilab_standalone_pts", JSON.stringify(points)); } catch(e) {}
      }, [points]);

      // Responsive chart observer
      useEffect(() => {
        if (!plotContainerRef.current) return;
        const obs = new ResizeObserver((entries) => {
          for (const entry of entries) {
            const width = entry.contentRect.width;
            if (width > 0) {
              setDimensions({ width, height: Math.max(320, Math.min(460, width * 0.6)) });
            }
          }
        });
        obs.observe(plotContainerRef.current);
        return () => obs.disconnect();
      }, []);

      const fitResult = useMemo(() => {
        return calculateFit(points, selectedFit, config.xName, config.yName);
      }, [points, selectedFit, config.xName, config.yName]);

      const activePoints = points.filter(p => !p.excluded && !isNaN(p.x) && !isNaN(p.y));
      const xStats = computeStats(activePoints.map(p => p.x));
      const yStats = computeStats(activePoints.map(p => p.y));

      // Plot bounding & coordinates
      const plotBounds = useMemo(() => {
        if (activePoints.length === 0) return { minX: 0, maxX: 10, minY: 0, maxY: 10 };
        let minX = Math.min(...activePoints.map(p => p.x));
        let maxX = Math.max(...activePoints.map(p => p.x));
        let minY = Math.min(...activePoints.map(p => p.y - (showErrorBars ? (p.yUncertainty || 0) : 0)));
        let maxY = Math.max(...activePoints.map(p => p.y + (showErrorBars ? (p.yUncertainty || 0) : 0)));

        if (selectedFit === "linear_origin" || minX >= 0) minX = Math.min(0, minX);
        if (minY >= 0) minY = Math.min(0, minY);
        if (minX === maxX) { minX -= 1; maxX += 1; }
        if (minY === maxY) { minY -= 1; maxY += 1; }

        const padX = (maxX - minX) * 0.08 || 1;
        const padY = (maxY - minY) * 0.08 || 1;
        return {
          minX: minX < 0 ? minX - padX : 0,
          maxX: maxX + padX,
          minY: minY < 0 ? minY - padY : 0,
          maxY: maxY + padY
        };
      }, [activePoints, selectedFit, showErrorBars]);

      const margin = { top: 25, right: 30, bottom: 50, left: 60 };
      const innerW = Math.max(80, dimensions.width - margin.left - margin.right);
      const innerH = Math.max(80, dimensions.height - margin.top - margin.bottom);

      const scaleX = (x) => margin.left + ((x - plotBounds.minX) / (plotBounds.maxX - plotBounds.minX)) * innerW;
      const scaleY = (y) => margin.top + innerH - ((y - plotBounds.minY) / (plotBounds.maxY - plotBounds.minY)) * innerH;

      const xTicks = useMemo(() => {
        const count = Math.max(4, Math.min(8, Math.floor(innerW / 70)));
        const step = (plotBounds.maxX - plotBounds.minX) / count;
        return Array.from({ length: count + 1 }, (_, i) => parseFloat((plotBounds.minX + i * step).toFixed(2)));
      }, [plotBounds, innerW]);

      const yTicks = useMemo(() => {
        const count = Math.max(4, Math.min(7, Math.floor(innerH / 45)));
        const step = (plotBounds.maxY - plotBounds.minY) / count;
        return Array.from({ length: count + 1 }, (_, i) => parseFloat((plotBounds.minY + i * step).toFixed(2)));
      }, [plotBounds, innerH]);

      const curvePath = useMemo(() => {
        if (!fitResult || activePoints.length < 2) return "";
        const { minX, maxX } = plotBounds;
        const samples = 100;
        const step = (maxX - minX) / samples;
        let d = "";
        for (let i = 0; i <= samples; i++) {
          const cx = minX + i * step;
          if (selectedFit === "power" && cx <= 0) continue;
          if (selectedFit === "inverse" && Math.abs(cx) < 1e-4) continue;
          const py = fitResult.predict(cx);
          if (isNaN(py) || !isFinite(py)) continue;
          const sx = scaleX(cx);
          const sy = scaleY(py);
          if (sy < margin.top - 50 || sy > margin.top + innerH + 50) continue;
          d += !d ? `M ${sx.toFixed(1)} ${sy.toFixed(1)}` : ` L ${sx.toFixed(1)} ${sy.toFixed(1)}`;
        }
        return d;
      }, [fitResult, activePoints, plotBounds, selectedFit, innerW, innerH]);

      // Handlers
      const handleSaveHeader = () => {
        setConfig({
          title: tTitle.trim() || "Lab Dataset",
          xName: tXName.trim() || "X",
          xUnit: tXUnit.trim(),
          yName: tYName.trim() || "Y",
          yUnit: tYUnit.trim(),
          notes: tNotes.trim()
        });
        setIsEditingHeader(false);
      };

      const handleCellChange = (id, field, valStr) => {
        const val = valStr === "" ? NaN : parseFloat(valStr);
        setPoints(points.map(p => p.id === id ? { ...p, [field]: isNaN(val) ? 0 : val } : p));
      };

      const handleTrialChange = (id, tIdx, valStr) => {
        const val = valStr === "" ? NaN : parseFloat(valStr);
        setPoints(points.map(p => {
          if (p.id !== id) return p;
          const trials = [...(p.trials || [p.y, p.y, p.y])];
          trials[tIdx] = isNaN(val) ? 0 : val;
          const stats = computeStats(trials);
          return {
            ...p,
            trials,
            y: parseFloat(stats.mean.toFixed(4)),
            yUncertainty: parseFloat((stats.stdDev || 0.05).toFixed(4))
          };
        }));
      };

      const handleAddRow = () => {
        const lastX = points.length > 0 ? points[points.length - 1].x : 0;
        const nextX = parseFloat((lastX + 1).toFixed(3));
        setPoints([...points, {
          id: "p_" + Date.now(),
          x: nextX,
          y: 0,
          yUncertainty: 0.05,
          trials: hasTrials ? [0,0,0] : undefined
        }]);
      };

      const handleGenerateSequence = () => {
        const start = parseFloat(qStart) || 0;
        const step = parseFloat(qStep) || 1;
        const count = Math.min(30, Math.max(2, parseInt(qCount) || 5));
        const newPts = [];
        for (let i = 0; i < count; i++) {
          newPts.push({
            id: "p_" + Date.now() + "_" + i,
            x: parseFloat((start + i * step).toFixed(4)),
            y: 0,
            yUncertainty: 0.05,
            trials: hasTrials ? [0,0,0] : undefined
          });
        }
        setPoints(newPts);
        setIsQuickFill(false);
      };

      const handleParsePaste = () => {
        if (!rawPaste.trim()) return;
        const lines = rawPaste.trim().split("\n");
        const parsed = [];
        for (let i = 0; i < lines.length; i++) {
          const row = lines[i].split(/[\t,;]+/).map(s => s.trim()).filter(Boolean);
          if (row.length >= 2) {
            const x = parseFloat(row[0]);
            const y = parseFloat(row[1]);
            const unc = row[2] ? parseFloat(row[2]) : 0.05;
            if (!isNaN(x) && !isNaN(y)) {
              parsed.push({
                id: "p_imp_" + Date.now() + "_" + i,
                x,
                y,
                yUncertainty: isNaN(unc) ? 0.05 : unc
              });
            }
          }
        }
        if (parsed.length > 0) {
          setPoints(parsed);
          setIsImportOpen(false);
          setRawPaste("");
        }
      };

      const handleExportPNG = () => {
        if (!svgRef.current) return;
        const svgString = new XMLSerializer().serializeToString(svgRef.current);
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const img = new Image();
        canvas.width = dimensions.width * 2;
        canvas.height = dimensions.height * 2;
        img.onload = () => {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.scale(2, 2);
          ctx.drawImage(img, 0, 0);
          const a = document.createElement("a");
          a.download = `${config.title.replace(/\\s+/g, "_")}_chart.png`;
          a.href = canvas.toDataURL("image/png");
          a.click();
        };
        img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgString);
      };

      const handleExportSVG = () => {
        if (!svgRef.current) return;
        const svgString = new XMLSerializer().serializeToString(svgRef.current);
        const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.download = `${config.title.replace(/\\s+/g, "_")}_plot.svg`;
        a.href = url;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleCopyMarkdown = () => {
        let md = `# Lab Report: ${config.title}\n`;
        md += `**Author:** ${studentName}  \n**Course:** ${classSection}  \n**Date:** ${reportDate}\n\n`;
        md += `## Variables\n- **X:** ${config.xName} (${config.xUnit})\n- **Y:** ${config.yName} (${config.yUnit})\n\n`;
        md += `## Data Table\n| Trial | ${config.xName} | ${config.yName} | Uncertainty |\n|:---:|:---:|:---:|:---:|\n`;
        activePoints.forEach((p, idx) => {
          md += `| ${idx + 1} | ${p.x} | ${p.y} | ±${p.yUncertainty || 0.05} |\n`;
        });
        if (fitResult) {
          md += `\n## Regression Fit\n- **Model:** ${fitResult.type}\n- **Equation:** \`${fitResult.equation}\`\n- **R²:** ${formatSigFigs(fitResult.r2, 5)}\n`;
        }
        navigator.clipboard.writeText(md);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* Header Navbar */}
          <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md backdrop-blur-md bg-opacity-95">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 via-blue-600 to-cyan-500 p-0.5 flex items-center justify-center font-bold text-lg text-cyan-300">
                  📈
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-bold text-slate-100 flex items-center gap-2">
                    Scientific Data Plotter
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                      Standalone Edition
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400 hidden sm:block">Universal STEM Curve Fitting & Statistical Analysis</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => {
                    setConfig(DEFAULT_CONFIG);
                    setPoints(DEFAULT_POINTS);
                    setSelectedFit("linear");
                  }}
                  className="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors"
                >
                  🔄 Sample Data

                      <button onClick={() => setIsEditingHeader(false)} className="px-3 py-1 text-xs text-slate-600">Cancel</button>
                      <button onClick={handleSaveHeader} className="px-3.5 py-1 text-xs bg-indigo-600 text-white font-semibold rounded-lg">Save</button>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Experiment Title</label>
                    <input type="text" value={tTitle} onChange={e => setTTitle(e.target.value)} className="w-full text-sm font-semibold border rounded-lg p-2" />
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 uppercase">X Variable</label>
                      <input type="text" value={tXName} onChange={e => setTXName(e.target.value)} className="w-full text-xs border rounded p-1.5" />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 uppercase">X Unit</label>
                      <input type="text" value={tXUnit} onChange={e => setTXUnit(e.target.value)} className="w-full text-xs border rounded p-1.5" />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 uppercase">Y Variable</label>
                      <input type="text" value={tYName} onChange={e => setTYName(e.target.value)} className="w-full text-xs border rounded p-1.5" />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-slate-500 uppercase">Y Unit</label>
                      <input type="text" value={tYUnit} onChange={e => setTYUnit(e.target.value)} className="w-full text-xs border rounded p-1.5" />
                    </div>
                  </div>
                </div>
              ) : (
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200">
                        LAB DATASET
                      </span>
                      <h2 className="text-lg font-bold text-slate-900">{config.title}</h2>
                    </div>
                    <div className="flex flex-wrap gap-4 mt-2 text-xs text-slate-600">
                      <span><strong>X-Axis:</strong> {config.xName} ({config.xUnit || "no unit"})</span>
                      <span><strong>Y-Axis:</strong> {config.yName} ({config.yUnit || "no unit"})</span>
                      {config.notes && <span><strong>Notes:</strong> {config.notes}</span>}
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => {
                      setTTitle(config.title); setTXName(config.xName); setTXUnit(config.xUnit);
                      setTYName(config.yName); setTYUnit(config.yUnit); setTNotes(config.notes || "");
                      setIsEditingHeader(true);
                    }}
                    className="px-3 py-1.5 text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg self-start sm:self-auto transition-colors"

                    ✏️ Edit Variables
                  </button>
                </div>
              )}
            </section>

            {/* Split Layout: Data Table + Scientific Plot */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">

                <div className="p-3.5 border-b bg-slate-50 flex items-center justify-between">
                  <div>
                    <h3 className="text-sm font-bold text-slate-900">Data Spreadsheet</h3>
                    <p className="text-[11px] text-slate-500">{activePoints.length} active points</p>

                  <div className="flex items-center gap-1.5">
                    <button
                      type="button"
                      onClick={() => setHasTrials(!hasTrials)}
                      className={`px-2.5 py-1 text-xs font-semibold rounded-lg border ${hasTrials ? 'bg-indigo-50 border-indigo-300 text-indigo-700' : 'bg-white text-slate-600'}`}

                      {hasTrials ? "3 Trials (ON)" : "Trials"}

                    <button
                      type="button"
                      onClick={() => setIsImportOpen(true)}
                      className="px-2.5 py-1 text-xs font-semibold rounded-lg bg-white border text-slate-700 hover:bg-slate-50"

                      📋 Paste CSV
                    </button>
                  </div>

                {/* Table Body */}
                <div className="overflow-x-auto overflow-y-auto max-h-[440px] flex-1">

                    <thead className="bg-slate-100 text-slate-700 sticky top-0 border-b font-bold">
                      <tr>
                        <th className="p-2 text-center w-8 text-slate-400">#</th>
                        <th className="p-2">{config.xName} [{config.xUnit}]</th>

                          <>
                            <th className="p-1">T1</th>
                            <th className="p-1">T2</th>
                            <th className="p-1">T3</th>
                            <th className="p-2 text-indigo-900">Mean {config.yName}</th>
                          </>
                        ) : (
                          <th className="p-2">{config.yName} [{config.yUnit}]</th>
                        )}
                        <th className="p-2">±δy</th>
                        <th className="p-2 text-center w-12">Act</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {points.map((p, idx) => (
                        <tr key={p.id} className={p.excluded ? "bg-slate-100/60 opacity-50 line-through" : "hover:bg-slate-50"}>
                          <td className="p-2 text-center text-slate-400">{idx + 1}</td>
                          <td className="p-1.5">
                            <input
                              type="number"
                              step="any"
                              value={isNaN(p.x) ? "" : p.x}
                              onChange={e => handleCellChange(p.id, "x", e.target.value)}
                              className="w-full px-1.5 py-0.5 border rounded bg-white"
                            />
                          </td>
                          {hasTrials ? (
                            <>
                              <td className="p-1"><input type="number" step="any" value={p.trials?.[0] ?? ""} onChange={e => handleTrialChange(p.id, 0, e.target.value)} className="w-12 px-1 py-0.5 border rounded" /></td>
                              <td className="p-1"><input type="number" step="any" value={p.trials?.[1] ?? ""} onChange={e => handleTrialChange(p.id, 1, e.target.value)} className="w-12 px-1 py-0.5 border rounded" /></td>
                              <td className="p-1"><input type="number" step="any" value={p.trials?.[2] ?? ""} onChange={e => handleTrialChange(p.id, 2, e.target.value)} className="w-12 px-1 py-0.5 border rounded" /></td>
                              <td className="p-2 font-bold text-indigo-900 bg-indigo-50/40">{p.y}</td>
                            </>
                          ) : (
                            <td className="p-1.5">
                              <input
                                type="number"
                                step="any"
                                value={isNaN(p.y) ? "" : p.y}
                                onChange={e => handleCellChange(p.id, "y", e.target.value)}
                                className="w-full px-1.5 py-0.5 border rounded bg-white"
                              />
                            </td>
                          )}
                          <td className="p-1.5">
                            <input
                              type="number"
                              step="any"
                              value={p.yUncertainty ?? ""}
                              onChange={e => handleCellChange(p.id, "yUncertainty", e.target.value)}

                            />
                          </td>
                          <td className="p-1.5 text-center">
                            <div className="flex gap-1 justify-center">
                              <button onClick={() => setPoints(points.map(pt => pt.id === p.id ? { ...pt, excluded: !pt.excluded } : pt))} title="Toggle Outlier" className="text-slate-400 hover:text-indigo-600">
                                {p.excluded ? "👁️" : "🙈"}
                              </button>
                              <button onClick={() => setPoints(points.filter(pt => pt.id !== p.id))} title="Delete Row" className="text-slate-400 hover:text-rose-600">
                                ✕
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="p-3 border-t bg-slate-50 flex items-center justify-between">
                  <div className="flex gap-2">
                    <button onClick={handleAddRow} className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg text-xs">
                      + Add Row
                    </button>
                    <button onClick={() => setIsQuickFill(!isQuickFill)} className="px-2.5 py-1.5 bg-white border text-slate-700 font-semibold rounded-lg text-xs">
                      # Fill Range
                    </button>
                  </div>
                  <div className="text-[11px] font-mono text-slate-500">
                    X̄: <strong>{xStats.mean.toFixed(2)}</strong> | Ȳ: <strong>{yStats.mean.toFixed(2)}</strong>
                  </div>
                </div>

                {isQuickFill && (
                  <div className="p-3 bg-indigo-50 border-t flex flex-wrap items-center gap-2 text-xs">
                    <span>Start:</span><input type="number" value={qStart} onChange={e => setQStart(e.target.value)} className="w-14 p-1 border rounded" />
                    <span>Step:</span><input type="number" value={qStep} onChange={e => setQStep(e.target.value)} className="w-14 p-1 border rounded" />
                    <span>Count:</span><input type="number" value={qCount} onChange={e => setQCount(e.target.value)} className="w-14 p-1 border rounded" />
                    <button onClick={handleGenerateSequence} className="px-2.5 py-1 bg-indigo-600 text-white font-bold rounded">Generate</button>
                  </div>
                )}
              </div>

              {/* Right Column: Scientific Plot */}
              <div className="lg:col-span-7 bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-5 flex flex-col">
                {/* Fit switcher */}
                <div className="flex flex-wrap items-center justify-between gap-2 pb-3 border-b">
                  <div>
                    <h3 className="text-sm font-bold text-slate-900">Scientific Plot & Curve Fit</h3>
                    <p className="text-[11px] text-slate-500">{config.yName} vs. {config.xName}</p>
                  </div>
                  <div className="flex flex-wrap gap-1">
                    {[
                      { id: "linear", label: "Linear" },
                      { id: "linear_origin", label: "Origin (0,0)" },
                      { id: "quadratic", label: "Quadratic" },
                      { id: "power", label: "Power" },
                      { id: "exponential", label: "Exp" },
                      { id: "inverse", label: "Inverse" }
                    ].map(f => (
                      <button
                        key={f.id}
                        type="button"
                        onClick={() => setSelectedFit(f.id)}
                        className={`px-2.5 py-1 text-xs font-semibold rounded-lg transition-colors ${selectedFit === f.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                      >
                        {f.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Fit Stats Banner */}
                {fitResult && (
                  <div className="mt-3 bg-slate-900 text-white p-3 rounded-xl flex flex-wrap items-center justify-between gap-3 text-xs font-mono">
                    <div className="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 font-bold border border-indigo-400/30">
                      {fitResult.equation}
                    </div>
                    <div className="flex items-center gap-4">
                      <span>R² = <strong className="text-emerald-400">{formatSigFigs(fitResult.r2, 5)}</strong></span>
                      {fitResult.slope !== undefined && <span>Slope: <strong className="text-cyan-300">{formatSigFigs(fitResult.slope, 4)}</strong></span>}
                      {fitResult.intercept !== undefined && <span>Intercept: <strong className="text-amber-300">{formatSigFigs(fitResult.intercept, 4)}</strong></span>}
                    </div>
                  </div>
                )}

                {/* SVG Graph Canvas */}
                <div ref={plotContainerRef} className="w-full mt-3 relative bg-slate-50 rounded-xl border border-slate-200 overflow-hidden flex-1 min-h-[320px]">
                  <svg ref={svgRef} width={dimensions.width} height={dimensions.height} className="w-full h-full select-none">
                    {/* Grid */}
                    <g opacity="0.4">
                      {yTicks.map((yv, i) => (
                        <line key={`gy-${i}`} x1={margin.left} y1={scaleY(yv)} x2={margin.left + innerW} y2={scaleY(yv)} stroke="#cbd5e1" strokeDasharray="3 3" />
                      ))}
                      {xTicks.map((xv, i) => (
                        <line key={`gx-${i}`} x1={scaleX(xv)} y1={margin.top} x2={scaleX(xv)} y2={margin.top + innerH} stroke="#cbd5e1" strokeDasharray="3 3" />
                      ))}
                    </g>

                    {/* Axes */}
                    <g stroke="#334155" strokeWidth="1.5">
                      <line x1={margin.left} y1={margin.top + innerH} x2={margin.left + innerW} y2={margin.top + innerH} />
                      <line x1={margin.left} y1={margin.top} x2={margin.left} y2={margin.top + innerH} />
                    </g>

                    {/* Ticks */}
                    <g fill="#64748b" fontSize="10" fontFamily="monospace">
                      {yTicks.map((yv, i) => (
                        <text key={`ty-${i}`} x={margin.left - 6} y={scaleY(yv) + 3.5} textAnchor="end">{yv}</text>
                      ))}
                      {xTicks.map((xv, i) => (
                        <text key={`tx-${i}`} x={scaleX(xv)} y={margin.top + innerH + 15} textAnchor="middle">{xv}</text>
                      ))}
                    </g>

                    {/* Axis Labels */}
                    <text x={margin.left + innerW / 2} y={dimensions.height - 10} textAnchor="middle" fill="#0f172a" fontSize="12" fontWeight="bold">
                      {config.xName} {config.xUnit ? `(${config.xUnit})` : ""}
                    </text>
                    <text x={-(margin.top + innerH / 2)} y={16} transform="rotate(-90)" textAnchor="middle" fill="#0f172a" fontSize="12" fontWeight="bold">
                      {config.yName} {config.yUnit ? `(${config.yUnit})` : ""}
                    </text>

                    {/* Curve */}
                    {curvePath && <path d={curvePath} fill="none" stroke="#4f46e5" strokeWidth="2.5" />}

                    {/* Points & Error Bars */}
                    {activePoints.map(p => {
                      const cx = scaleX(p.x);
                      const cy = scaleY(p.y);
                      const unc = p.yUncertainty || 0;
                      const isHov = hoveredPoint?.id === p.id;
                      return (
                        <g key={p.id} onMouseEnter={() => setHoveredPoint(p)} onMouseLeave={() => setHoveredPoint(null)} className="cursor-pointer">
                          {showErrorBars && unc > 0 && (
                            <g stroke="#6366f1" strokeWidth="1.2">
                              <line x1={cx} y1={scaleY(p.y + unc)} x2={cx} y2={scaleY(p.y - unc)} />
                              <line x1={cx - 3} y1={scaleY(p.y + unc)} x2={cx + 3} y2={scaleY(p.y + unc)} />
                              <line x1={cx - 3} y1={scaleY(p.y - unc)} x2={cx + 3} y2={scaleY(p.y - unc)} />
                            </g>
                          )}
                          <circle cx={cx} cy={cy} r={isHov ? 6.5 : 5} fill={p.excluded ? "#cbd5e1" : "#1e1b4b"} stroke={isHov ? "#4f46e5" : "#38bdf8"} strokeWidth="2" />
                        </g>
                      );
                    })}
                  </svg>
                </div>

                {/* Plot Controls & Downloads */}
                <div className="mt-3 pt-3 border-t flex flex-wrap items-center justify-between gap-2 text-xs">
                  <div className="flex items-center gap-3">
                    <label className="flex items-center gap-1 cursor-pointer text-slate-700">
                      <input type="checkbox" checked={showErrorBars} onChange={e => setShowErrorBars(e.target.checked)} className="rounded" />
                      <span>Error Bars</span>
                    </label>
                    <button type="button" onClick={() => setShowResiduals(!showResiduals)} className="text-slate-600 hover:text-slate-900">
                      {showResiduals ? "Hide Residuals" : "Show Residuals"}
                    </button>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={handleExportPNG} className="px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold">
                      📥 PNG
                    </button>
                    <button onClick={handleExportSVG} className="px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold">
                      📥 SVG
                    </button>
                  </div>
                </div>

                {/* Residuals Drawer */}
                {showResiduals && fitResult && (
                  <div className="mt-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
                    <div className="text-xs font-bold text-slate-800 mb-1">Residuals Plot (Δy = Actual - Predicted)</div>
                    <div className="h-24 bg-white rounded border relative overflow-hidden">
                      <svg width="100%" height="100%">
                        <line x1="30" y1="48" x2="98%" y2="48" stroke="#94a3b8" strokeDasharray="3 3" />
                        {fitResult.residuals.map(r => {
                          const cx = scaleX(r.x);
                          const maxR = Math.max(0.1, ...fitResult.residuals.map(x => Math.abs(x.residual))) * 1.3;
                          const cy = 48 - (r.residual / maxR) * 38;
                          return <circle key={r.id} cx={cx} cy={cy} r="3.5" fill={r.residual >= 0 ? "#10b981" : "#f43f5e"} />;
                        })}
                      </svg>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </main>

          {/* Import Modal */}
          {isImportOpen && (

              <div className="bg-white rounded-2xl p-6 max-w-lg w-full space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-slate-900">Paste Spreadsheet Data</h3>
                  <button onClick={() => setIsImportOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <p className="text-xs text-slate-600">Copy columns from Excel / Sheets and paste below (Col 1 = X, Col 2 = Y, Col 3 = Uncertainty):</p>
                <textarea rows="6" value={rawPaste} onChange={e => setRawPaste(e.target.value)} placeholder={"1.0\t2.5\n2.0\t5.1\n3.0\t7.4"} className="w-full text-xs font-mono p-3 border rounded-xl" />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setIsImportOpen(false)} className="px-3 py-1.5 text-xs text-slate-600">Cancel</button>
                  <button onClick={handleParsePaste} className="px-4 py-1.5 text-xs bg-indigo-600 text-white font-bold rounded-lg">Import Data</button>
                </div>
              </div>
            </div>
          )}

          {/* Report Modal */}
          {isReportOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl max-w-3xl w-full my-auto max-h-[90vh] flex flex-col overflow-hidden">
                <div className="p-4 bg-slate-900 text-white flex justify-between items-center print:hidden">
                  <h3 className="font-bold text-sm">Lab Report Write-Up Preview</h3>
                  <div className="flex gap-2">
                    <button onClick={handleCopyMarkdown} className="px-3 py-1 text-xs bg-slate-800 text-slate-200 rounded font-semibold">
                      {copied ? "Copied!" : "Copy Markdown"}
                    </button>
                    <button onClick={() => window.print()} className="px-3 py-1 text-xs bg-emerald-600 text-white rounded font-bold">
                      Print / PDF
                    </button>
                    <button onClick={() => setIsReportOpen(false)} className="p-1 text-slate-400 hover:text-white">✕</button>
                  </div>
                </div>

                <div id="printable-lab-report" className="p-8 overflow-y-auto space-y-6 text-slate-900 text-xs">
                  <div className="border-b-2 border-slate-900 pb-3">
                    <div className="text-xs uppercase font-bold text-indigo-700 tracking-widest">Laboratory Investigation Report</div>
                    <h1 className="text-2xl font-extrabold mt-1">{config.title}</h1>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-4">
                      <div><strong>Author:</strong> <input type="text" value={studentName} onChange={e => setStudentName(e.target.value)} className="font-semibold bg-transparent border-b w-full" /></div>
                      <div><strong>Partner:</strong> <input type="text" value={labPartner} onChange={e => setLabPartner(e.target.value)} className="font-semibold bg-transparent border-b w-full" /></div>
                      <div><strong>Course:</strong> <input type="text" value={classSection} onChange={e => setClassSection(e.target.value)} className="font-semibold bg-transparent border-b w-full" /></div>
                      <div><strong>Date:</strong> <input type="text" value={reportDate} onChange={e => setReportDate(e.target.value)} className="font-semibold bg-transparent border-b w-full" /></div>
                    </div>
                  </div>

                  <div>
                    <h2 className="font-bold text-sm uppercase text-slate-800 border-b pb-1">1. Variables & Notes</h2>
                    <p className="mt-1"><strong>Independent (X):</strong> {config.xName} ({config.xUnit}) | <strong>Dependent (Y):</strong> {config.yName} ({config.yUnit})</p>
                    {config.notes && <p className="mt-1 text-slate-600">{config.notes}</p>}
                  </div>

                  <div>
                    <h2 className="font-bold text-sm uppercase text-slate-800 border-b pb-1">2. Experimental Data Table</h2>
                    <table className="w-full text-left font-mono mt-2 border">
                      <thead className="bg-slate-100 border-b">
                        <tr>
                          <th className="p-1.5 w-12 text-center">#</th>
                          <th className="p-1.5">{config.xName} [{config.xUnit}]</th>
                          <th className="p-1.5">{config.yName} [{config.yUnit}]</th>
                          <th className="p-1.5">Uncertainty</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y">
                        {activePoints.map((p, idx) => (
                          <tr key={p.id}>
                            <td className="p-1 text-center text-slate-400">{idx + 1}</td>
                            <td className="p-1 font-bold">{p.x}</td>
                            <td className="p-1 text-indigo-900">{p.y}</td>
                            <td className="p-1 text-slate-500">±{p.yUncertainty || 0.05}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {fitResult && (
                    <div>
                      <h2 className="font-bold text-sm uppercase text-slate-800 border-b pb-1">3. Regression Analysis</h2>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2 font-mono">
                        <div className="bg-slate-50 p-2 border rounded"><span>Model:</span> <strong className="block text-indigo-900">{fitResult.equation}</strong></div>
                        <div className="bg-slate-50 p-2 border rounded"><span>R²:</span> <strong className="block text-emerald-700">{formatSigFigs(fitResult.r2, 5)}</strong></div>
                        {fitResult.slope !== undefined && <div className="bg-slate-50 p-2 border rounded"><span>Slope (m):</span> <strong className="block">{formatSigFigs(fitResult.slope, 4)}</strong></div>}
                        {fitResult.intercept !== undefined && <div className="bg-slate-50 p-2 border rounded"><span>Intercept (b):</span> <strong className="block">{formatSigFigs(fitResult.intercept, 4)}</strong></div>}
                      </div>
                    </div>
                  )}

                  <div>
                    <h2 className="font-bold text-sm uppercase text-slate-800 border-b pb-1">4. Student Discussion & Conclusion</h2>
                    <textarea rows="4" value={customConclusion} onChange={e => setCustomConclusion(e.target.value)} placeholder="Write experiment conclusions and physical findings..." className="w-full p-2 border rounded-xl mt-2 print:border-none print:p-0" />
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Help Modal */}
          {isHelpOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full space-y-4 text-xs text-slate-700">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-slate-900 text-sm">How to Use the Scientific Plotter</h3>
                  <button onClick={() => setIsHelpOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <ul className="space-y-2 list-disc pl-4">
                  <li><strong>Define Variables:</strong> Click &quot;Edit Variables&quot; to change X/Y labels and units.</li>
                  <li><strong>Enter Data:</strong> Type rows, paste spreadsheet data, or auto-fill arithmetic ranges.</li>
                  <li><strong>Curve Fitting:</strong> Toggle between Linear, Origin, Quadratic, Power, Exponential, and Inverse models.</li>
                  <li><strong>Export:</strong> Download PNG or vector SVG charts, or export a formatted printable lab write-up.</li>
                </ul>
                <div className="flex justify-end">
                  <button onClick={() => setIsHelpOpen(false)} className="px-4 py-1.5 bg-indigo-600 text-white font-bold rounded-lg">Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
